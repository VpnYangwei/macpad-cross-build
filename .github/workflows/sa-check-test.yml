name: sa-check-test
on:
  workflow_dispatch:
permissions:
  issues: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ask for a documentation addition
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/issues" \
            -f title='[check-test] 新增 docs/worker-selfcheck.md' \
            -f body='@VpnYangwei 请在仓库根目录新增文件 docs/worker-selfcheck.md，内容只有一行：worker self-check ok。提交到新分支并开 PR，标题写「docs: add worker-selfcheck」。'
