name: sa-check-test
on:
  workflow_dispatch:
permissions:
  issues: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ask for a copy fix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/issues" \
            -f title='[check-test] interpose.h 第 3 行行尾空格' \
            -f body='@VpnYangwei interpose.h 第 3 行是只有 `//` 加两个行尾空格的空注释行（`//  `）。请把这两个行尾空格删掉改成 `//`，其他行不动。提交到新分支并开 PR，标题写「style: trim trailing spaces in interpose.h header」。'
