name: superagent-selftest
on:
  workflow_dispatch:
permissions:
  issues: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Open a test issue with a concrete request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/issues" \
            -f title='[self-test] 临时自测工单（可忽略）' \
            -f body='@VpnYangwei 请把本 issue 的标题改成「自测通过」，改完回一句结果。'
